# ShambaSmart on Render's free plan (Render "Blueprint"): one web service serves the API at /api and the web app at /.
# The database is PostgreSQL on Neon (free). Render's free services sleep after about 15 minutes without visitors and
# take up to a minute to wake; the app waits for that by itself.
# No secrets in this file: Render makes JWT_SECRET, and the rest (sync: false) are typed into Render's settings page.
services:
  - type: web
    name: shambasmart
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # The web app is built first (it needs its development tools), then the server's own packages.
    buildCommand: >-
      cd app && yarn install --frozen-lockfile --production=false && yarn build:web &&
      cd ../backend && yarn install --frozen-lockfile --production=true
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render's front door passes on the visitor's address (used for the sign-in rate limit).
      - key: TRUST_PROXY
        value: "1"
      - key: DB_ENGINE
        value: postgres
      # Neon's connection string (Neon dashboard → your project → Connect), ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Llama 4 Scout on Cloudflare Workers AI reads the crop photos (free account; see backend/.env.example).
      # Empty: the photo check says it is not set up.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: DIAGNOSES_PER_DAY
        value: "10"
